# SonarQube project key must match the Project Key created in SonarQube.
sonar.projectKey=Sonar_pytest
sonar.projectName=Sonar_pytest
sonar.sources=.
sonar.sourceEncoding=UTF-8
sonar.python.version=3.14.8
sonar.python.coverage.reportPaths=coverage.xml

# Exclude repository metadata and dependency/build directories.
sonar.exclusions=.git/**,**/node_modules/**,**/dist/**,**/build/**
